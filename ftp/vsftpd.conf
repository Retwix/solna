# vsftpd config for Solna V0 — virtual users, one per event.
listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Virtual users
guest_enable=YES
guest_username=vsftpd
user_sub_token=$USER
local_root=/home/vsftpd/raw/$USER
virtual_use_local_privs=YES
pam_service_name=vsftpd
chroot_local_user=YES
allow_writeable_chroot=YES
hide_ids=YES

# Passive mode (match the published port range in docker-compose)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
