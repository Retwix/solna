services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: solna
      POSTGRES_PASSWORD: solna
      POSTGRES_DB: solna
    ports:
      - "55432:5432"   # host:container — host remapped to avoid conflicts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solna"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO no longer publishes community images; this frozen build is dev-only.
  # The bucket is created private. Browsers get photos through expiring
  # signed links minted by the API.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: solna-media
    ports:
      - "9100:9000"   # S3 API   (host 9100)
      - "9101:9001"   # console   (host 9101)
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8000"   # API on host 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Facial recognition (V1): detect + embed faces. Both the FTP server (on ingest)
  # and the API (on guest selfie) call it. Set FACE_ENGINE=fake in .env to run
  # the whole pipeline without downloading the InsightFace model.
  faceservice:
    build: ./faceservice
    env_file: .env
    ports:
      - "9200:9000"   # face service on host 9200 (debugging)
    volumes:
      - facemodels:/root/.insightface   # cache the downloaded model across restarts
    # Healthy only once the model is loaded (it loads before uvicorn serves);
    # the first boot also downloads it, hence the long start period.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s

  # Solna FTP server: authenticates each login against the photographers table,
  # chroots the user into raw/{photographer_id}, and ingests every fully
  # received photo (S3 + thumbnail + faces -> API). Set FTP_PASV_ADDRESS in
  # .env to your LAN IP for cameras.
  ftp:
    build: ./ftpserver
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy   # migrations done
      faceservice:
        condition: service_healthy   # model loaded
    ports:
      - "2121:21"   # FTP control on host 2121
      - "21100-21110:21100-21110"   # passive data range
    volumes:
      - ftpdata:/data/ftp

volumes:
  pgdata:
  miniodata:
  ftpdata:
  facemodels:
