services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: solna
      POSTGRES_PASSWORD: solna
      POSTGRES_DB: solna
    ports:
      - "55432:5432"   # host:container — host remapped to avoid conflicts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solna"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"   # S3 API   (host 9100)
      - "9101:9001"   # console   (host 9101)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket on startup and makes it publicly readable (V0: public gallery).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/solna-media || true &&
      mc anonymous set download local/solna-media &&
      echo 'bucket ready'
      "

  api:
    build: ./api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8000"   # API on host 8080
    volumes:
      - ftpdata:/data/ftp

  watcher:
    build: ./watcher
    env_file: .env
    depends_on:
      - api
    volumes:
      - ftpdata:/data/ftp

  # Solna FTP server: authenticates each login against the events table and
  # chroots the user into raw/{event_id}. Writes into the shared ftpdata volume
  # the watcher observes. Set FTP_PASV_ADDRESS in .env to your LAN IP for cameras.
  ftp:
    build: ./ftpserver
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2121:21"   # FTP control on host 2121
      - "21100-21110:21100-21110"   # passive data range
    volumes:
      - ftpdata:/data/ftp

volumes:
  pgdata:
  miniodata:
  ftpdata:
